{% extends "base.html" %}
{% block title %}Log In – Science Fair Judging{% endblock %}

{% block navbar %}
<nav class="navbar">
    <span class="brand"> Science Fair Judging</span>
    <div>
        <a href="{{ url_for('index') }}">Home</a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card" style="text-align: center;">
        <h1>Judge Log In</h1>
        <p class="subtitle">Sign in or sign up with your Google account.</p>
        
        <!-- We use an empty form or direct link to start the Google OAuth flow, 
             which simplifies the design. -->
        <a href="{{ url_for('login', provider='google') }}" class="btn btn-primary" style="display:inline-block; width:100%; margin-top:1rem; padding: 0.75rem;">
            Sign in with Google
        </a>

        <p style="text-align:center; margin-top:1.5rem; font-size:0.85rem; color: var(--text-muted);">
            <a href="{{ url_for('index') }}" class="link">Back to Home</a>
        </p>
    </div>
</div>
{% endblock %}
