{% extends "base.html" %}
{% block title %}Welcome – Science Fair Judging{% endblock %}

{% block navbar %}
<nav class="navbar">
    <span class="brand"> Science Fair Judging</span>
</nav>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card" style="text-align: center; max-width: 500px; margin: 2rem auto;">
        <h1>Science Fair Judging</h1>
        <p class="subtitle" style="margin-bottom: 2rem;">Please select your role to continue.</p>
        
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <a href="{{ url_for('login') }}" class="btn btn-primary" style="padding: 1rem; font-size: 1.1rem;">
                Judge Sign In / Sign Up
            </a>

            <div style="margin: 1rem 0; color: var(--text-muted); position: relative;">
                <hr style="border: none; border-top: 1px solid var(--border);">
                <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 0 10px; font-size: 0.9rem;">or</span>
            </div>
            
            <a href="{{ url_for('admin_login') }}" class="btn" style="padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); color: var(--text);">
                Admin Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
